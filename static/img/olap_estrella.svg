<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Modelo estrella NexoBio-ETV</title>
  <desc id="d">Tabla de hechos fact_notificacion conectada con las dimensiones dim_evento, dim_territorio, dim_anio y dim_semana.</desc>
  <rect width="960" height="600" fill="#f8fafc"/>
  <!-- conexiones -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="290" y1="150" x2="390" y2="235"/>
    <line x1="670" y1="150" x2="570" y2="235"/>
    <line x1="290" y1="450" x2="390" y2="365"/>
    <line x1="670" y1="450" x2="570" y2="365"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0f172a">
    <text x="300" y="168">1</text><text x="372" y="226">N</text>
    <text x="648" y="168">1</text><text x="580" y="226">N</text>
    <text x="300" y="440">1</text><text x="372" y="384">N</text>
    <text x="648" y="440">1</text><text x="580" y="384">N</text>
  </g>
  <!-- hechos -->
  <rect x="360" y="215" width="240" height="170" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <rect x="360" y="215" width="240" height="34" rx="8" fill="#0f172a"/>
  <text x="480" y="238" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">fact_notificacion</text>
  <g font-size="13" fill="#0f172a">
    <text x="376" y="272">PK, FK  evento_key</text>
    <text x="376" y="292">PK, FK  territorio_key</text>
    <text x="376" y="312">PK, FK  anio_key</text>
    <text x="376" y="332">PK, FK  semana_key</text>
    <text x="376" y="358" font-weight="700" fill="#0284c7">casos  (medida aditiva)</text>
    <text x="376" y="376" font-size="11" fill="#475569">1 fila = evento × municipio × semana × año</text>
  </g>
  <!-- dim evento -->
  <rect x="40" y="40" width="250" height="125" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="40" width="250" height="32" rx="8" fill="#0284c7"/>
  <text x="165" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">dim_evento</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="54" y="92">PK  evento_key</text><text x="54" y="110">cod_evento · evento</text>
    <text x="54" y="128">familia (Dengue, Chikungunya, Chagas)</text><text x="54" y="146">vector (Aedes, Triatominos)</text>
  </g>
  <!-- dim territorio -->
  <rect x="670" y="40" width="250" height="125" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <rect x="670" y="40" width="250" height="32" rx="8" fill="#0284c7"/>
  <text x="795" y="62" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">dim_territorio</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="684" y="92">PK  territorio_key · cod_municipio</text><text x="684" y="110">municipio · departamento</text>
    <text x="684" y="128">region_natural</text><text x="684" y="146">tipo_ubicacion (municipio, exterior…)</text>
  </g>
  <!-- dim anio -->
  <rect x="40" y="435" width="250" height="110" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="435" width="250" height="32" rx="8" fill="#0284c7"/>
  <text x="165" y="457" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">dim_anio</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="54" y="487">PK  anio_key (2007–2022)</text><text x="54" y="505">periodo (2007-2010, 2011-2016, 2017-2022)</text>
    <text x="54" y="523">tipo_anio (Epidémico / No epidémico)</text>
  </g>
  <!-- dim semana -->
  <rect x="670" y="435" width="250" height="110" rx="8" fill="#fff" stroke="#0284c7" stroke-width="2"/>
  <rect x="670" y="435" width="250" height="32" rx="8" fill="#0284c7"/>
  <text x="795" y="457" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">dim_semana</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="684" y="487">PK  semana_key (1–53)</text><text x="684" y="505">trimestre_epi (1–4)</text>
    <text x="684" y="523">trimestre (T1 sem 1-13 … T4)</text>
  </g>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="480" y="30">Jerarquías: Evento: vector → familia → evento · Territorio: región → departamento → municipio</text>
    <text x="480" y="585">Año: periodo → año · Semana: trimestre epidemiológico → semana</text>
  </g>
</svg>
