<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
  <title id="t">Modelo estrella multifuente NexoBio-ETV</title>
  <desc id="d">La tabla de hechos fact_notificacion se relaciona con las dimensiones dim_tiempo, dim_territorio, dim_evento y dim_fuente.</desc>
  <rect width="1120" height="780" fill="#f3f4f6"/>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="320" y1="225" x2="397" y2="310"/>
    <line x1="800" y1="225" x2="723" y2="310"/>
    <line x1="320" y1="555" x2="397" y2="470"/>
    <line x1="800" y1="555" x2="723" y2="470"/>
  </g>
  <g font-size="13" font-weight="700" fill="#1e3a8a">
    <text x="332" y="238">1</text><text x="382" y="303">N</text>
    <text x="780" y="238">1</text><text x="730" y="303">N</text>
    <text x="332" y="545">1</text><text x="382" y="482">N</text>
    <text x="780" y="545">1</text><text x="730" y="482">N</text>
  </g>
  <text x="560" y="25" text-anchor="middle" font-size="20" font-weight="700" fill="#1e4e79">Modelo estrella NexoBio-ETV — vigilancia multifuente</text>
  <text x="560" y="48" text-anchor="middle" font-size="12" fill="#64748b">Diseño de referencia: una tabla de hechos y cuatro dimensiones conformadas · conteos del diagrama recibido</text>

  <rect x="395" y="285" width="330" height="210" rx="8" fill="#fff" stroke="#ea7b2c" stroke-width="2"/>
  <path d="M403 285h314a8 8 0 0 1 8 8v29H395v-29a8 8 0 0 1 8-8z" fill="#e87932"/>
  <text x="560" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">fact_notificacion</text>
  <text x="705" y="307" text-anchor="end" font-size="10" fill="#fff">334.780 filas</text>
  <g font-size="12.5" fill="#0f172a">
    <text x="412" y="342"><tspan font-weight="700" fill="#c2410c">PK</tspan><tspan dx="18">notificacion_id</tspan></text>
    <text x="412" y="362"><tspan font-weight="700" fill="#1d4ed8">FK</tspan><tspan dx="18">tiempo_key</tspan></text>
    <text x="412" y="382"><tspan font-weight="700" fill="#1d4ed8">FK</tspan><tspan dx="18">territorio_key</tspan></text>
    <text x="412" y="402"><tspan font-weight="700" fill="#1d4ed8">FK</tspan><tspan dx="18">evento_key</tspan></text>
    <text x="412" y="422"><tspan font-weight="700" fill="#1d4ed8">FK</tspan><tspan dx="18">fuente_key</tspan></text>
    <text x="412" y="442"><tspan font-weight="700" fill="#64748b">D</tspan><tspan dx="18">id_brote (degenerada)</tspan></text>
    <text x="412" y="464"><tspan font-weight="700" fill="#c2410c">M</tspan><tspan dx="18">casos · brotes (excluyentes)</tspan></text>
    <text x="560" y="484" text-anchor="middle" font-size="10.5" fill="#475569">1 observación; casos o brotes según la fuente</text>
  </g>

  <rect x="20" y="70" width="300" height="190" rx="7" fill="#fff" stroke="#1e4e79" stroke-width="2"/>
  <path d="M27 70h286a7 7 0 0 1 7 7v28H20V77a7 7 0 0 1 7-7z" fill="#1e4e79"/>
  <text x="36" y="94" font-size="15" font-weight="700" fill="#fff">dim_tiempo</text>
  <text x="305" y="93" text-anchor="end" font-size="10" fill="#fff">866 filas</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="35" y="126"><tspan font-weight="700" fill="#c2410c">PK</tspan><tspan dx="12">tiempo_key = año × 100 + semana</tspan></text>
    <text x="35" y="148">año · semana (0–53)</text>
    <text x="35" y="168">trimestre_epi · trimestre_epi_nombre</text>
    <text x="35" y="188">periodo · anio_completo (Si / No)</text>
    <text x="35" y="220" font-weight="700" fill="#047857">Jerarquía:</text>
    <text x="35" y="240" fill="#047857">Periodo → Año → Trimestre epi. → Semana</text>
    <text x="35" y="255" font-size="10" fill="#64748b">Semana 0 = registro anual, sin semana</text>
  </g>

  <rect x="800" y="70" width="300" height="190" rx="7" fill="#fff" stroke="#1e4e79" stroke-width="2"/>
  <path d="M807 70h286a7 7 0 0 1 7 7v28H800V77a7 7 0 0 1 7-7z" fill="#1e4e79"/>
  <text x="816" y="94" font-size="15" font-weight="700" fill="#fff">dim_territorio</text>
  <text x="1085" y="93" text-anchor="end" font-size="10" fill="#fff">1.378 filas</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="815" y="126"><tspan font-weight="700" fill="#c2410c">PK</tspan><tspan dx="12">territorio_key</tspan></text>
    <text x="815" y="148">ámbito · región · área · localidad</text>
    <text x="815" y="168">codigo_territorio · cod_departamento</text>
    <text x="815" y="188">subregion_onu</text>
    <text x="815" y="220" font-weight="700" fill="#047857">Jerarquía:</text>
    <text x="815" y="240" fill="#047857">Ámbito → Región → Área → Localidad</text>
    <text x="815" y="255" font-size="10" fill="#64748b">Colombia y Mundo</text>
  </g>

  <rect x="20" y="530" width="300" height="190" rx="7" fill="#fff" stroke="#1e4e79" stroke-width="2"/>
  <path d="M27 530h286a7 7 0 0 1 7 7v28H20v-28a7 7 0 0 1 7-7z" fill="#1e4e79"/>
  <text x="36" y="554" font-size="15" font-weight="700" fill="#fff">dim_evento</text>
  <text x="305" y="553" text-anchor="end" font-size="10" fill="#fff">135 filas</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="35" y="586"><tspan font-weight="700" fill="#c2410c">PK</tspan><tspan dx="12">evento_key</tspan></text>
    <text x="35" y="608">catálogo · cod_evento · evento</text>
    <text x="35" y="628">enfermedad · grupo (ETV / No ETV)</text>
    <text x="35" y="648">cobertura · capitulo_cie10</text>
    <text x="35" y="680" font-weight="700" fill="#047857">Jerarquía: Grupo → Enfermedad → Evento</text>
    <text x="35" y="700" font-size="10" fill="#64748b">Catálogos SIVIGILA y CIE-10 OMS</text>
  </g>

  <rect x="800" y="530" width="300" height="190" rx="7" fill="#fff" stroke="#1e4e79" stroke-width="2"/>
  <path d="M807 530h286a7 7 0 0 1 7 7v28H800v-28a7 7 0 0 1 7-7z" fill="#1e4e79"/>
  <text x="816" y="554" font-size="15" font-weight="700" fill="#fff">dim_fuente</text>
  <text x="1085" y="553" text-anchor="end" font-size="10" fill="#fff">3 filas</text>
  <g font-size="11.5" fill="#0f172a">
    <text x="815" y="586"><tspan font-weight="700" fill="#c2410c">PK</tspan><tspan dx="12">fuente_key</tspan></text>
    <text x="815" y="608">fuente · escala</text>
    <text x="815" y="628">unidad_medida · archivo_origen</text>
    <text x="815" y="660" font-weight="700" fill="#047857">Jerarquía: Escala → Fuente</text>
    <text x="815" y="680" fill="#64748b">Global · Nacional · Regional</text>
  </g>
  <text x="560" y="755" text-anchor="middle" font-size="11" fill="#64748b">Casos notificados y brotes reportados son medidas excluyentes y conservan unidades separadas.</text>
</svg>
